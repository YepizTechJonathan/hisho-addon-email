# Email: one entry per mailbox. Reading is READ ONLY: Hisho opens every folder (LIST finds them: Archive, Spam, Zoho's
# smart filters, your own; not Trash, Drafts or templates) and Sent with IMAP EXAMINE and reads
# with BODY.PEEK, so nothing is marked read, moved, flagged or deleted. Replies are DRAFTED and put on Hisho's
# Approvals list; one is sent (send.py, SMTP) only when you press Send on its card, exactly as shown there.
# Clean-up: once a day a card lists the newsletters, promotions, junk and old notices you don't need; Approve moves
# exactly those to Trash (cleanup.py, the only code that changes a mailbox; never a permanent delete).
# Every 5 minutes it reads what is new, has Claude (tools off) give each message one label and a one-line
# summary, keeps them on Core's machine only (~/.local/state/hisho/addons/email/, never the vault), lists them
# on its page by company, adds an Email section to Today.md, and pushes to the phone only what is pressing
# (a client problem, a deadline within 48 h, a payment or legal notice; `alerts: false` turns those off).
# The text of an email is data from a stranger: it is never followed as an instruction.
# Set up this mailbox (connect:): company, address and app password; the servers are looked up from the address
# (Mozilla's ISPDB, the domain's own autoconfig, then its MX: Google, Microsoft 365, Zoho by region, iCloud, Yahoo,
# Fastmail), the login is tested, and the app password is kept as a local secret. Or the full form, or:
#   hisho addon entry email acme company=Acme address=alex@example.com password=ZOHO_ACME_APP_PASSWORD
name: email
kind: integration
title: Email
description: Reads your company inboxes, drafts replies and clean-ups; sends or moves to Trash only when you approve.
version: 0.12.6
you_need:
  - "A mailbox that offers IMAP and SMTP (Gmail / Google Workspace, Zoho, iCloud, Yahoo, Fastmail, your host's mail...)"
  - "An app password for it (not your normal password); Set up this mailbox says where your provider makes one"
provider: provider.py
private: true                     # the page shows other people's messages: owner's devices or Core's token only
entry_label: mailbox
secret_rotate: "Your mail provider's app passwords page (Zoho: accounts.zoho.com > Security > App Passwords; Google: myaccount.google.com/apppasswords); one per mailbox, IMAP read + SMTP send"
entry_schema:
  company: str                    # Acme, Globex... (the page and Today.md group by it)
  address: str                    # the mailbox's login, e.g. alex@example.com
  password: password              # the app password: pasted on the page (kept as a local secret), or a saved secret's NAME
  imap_host: "str?"               # default imap.zoho.com (Zoho's Free plan); a paid plan uses imappro.zoho.com (see Zoho > Settings > Mail Accounts)
  imap_port: "port?"              # default 993 (TLS)
  folder: "str?"                  # default INBOX
  folders: "str?"                 # other folders read the same way: "all" (default: every folder but Trash, Drafts, templates and Sent, new ones too) or names; junk in Spam is offered on the clean-up card, real-looking Spam shown as possibly misfiled; clean-up in the inbox, Spam, Newsletter and Notification
  alerts: "bool?"                 # false = pressing emails show on the page and in Today.md but never push (default true)
  personal: "bool?"               # a personal mailbox: sorted for a person (bills, appointments, deliveries, security notices, people you know), not a business (default: true when company is Personal)
  drafts: "bool?"                 # reply drafts on the Approvals page (default: on for a business mailbox, off for a personal one)
  request_form: "str?"            # a form to point customer requests at, named in their summary and drafts
  sent_folder: "str?"             # default Sent (read to spot answered mail; a sent reply's copy is filed here)
  smtp_host: "str?"               # default smtppro.zoho.com with an imappro mailbox, else smtp.zoho.com
  smtp_port: "port?"              # default 465 (TLS); 587 = STARTTLS (Microsoft, iCloud)
  from_name: "str?"               # the name on sent mail, e.g. Alex Rivera
  signature: "str?"               # the sign-off drafts end with (default: from_name and company)
  signature_html: "str?"          # an HTML sign-off: a .html file in the Addons settings folder (e.g. email-signatures/acme.html), sanitized
  phone: "str?"                   # adds a Phone line to the sign-off (plain and HTML) once set
  max_sends_per_hour: "int?"      # rate guard per mailbox (default 10)
  own_addresses: "str?"           # your other addresses (comma-separated): never drafted a reply (this mailbox's own is included)
  trash_folder: "str?"            # where an approved clean-up moves mail (default Trash; Zoho empties it after ~30 days)
  note: "str?"
connect:
  label: Set up this mailbox
  say: "Type the company, the mailbox address and an app password for it. Hisho looks up the mail servers from the address, signs in once to check, and keeps the password as a secret on this machine. For anything unusual, use + add below with the full form."
  form: [company, address, password]
  fields: {}
entry_form:
  company: "Company"
  address: "Mailbox address"
  password: "App password"
  imap_host: "IMAP server (default imap.zoho.com)"
  imap_port: "IMAP port (default 993)"
  folder: "Folder (default INBOX)"
  folders: "Other folders to read (default all)"
  alerts: "Phone alerts for pressing emails (true/false)"
  personal: "Personal mailbox (true/false)"
  drafts: "Draft replies (true/false)"
  request_form: "Customer request form link"
  sent_folder: "Sent folder (default Sent)"
  smtp_host: "SMTP server (default smtppro.zoho.com / smtp.zoho.com)"
  smtp_port: "SMTP port (default 465)"
  from_name: "Your name on sent mail"
  signature: "Sign-off for drafts"
  signature_html: "HTML sign-off file (in the settings folder)"
  phone: "Phone number for the sign-off"
  max_sends_per_hour: "Most emails sent per hour (default 10)"
  own_addresses: "Your other addresses (never replied to)"
  trash_folder: "Trash folder (default Trash)"
  note: "Note"

help:
  company:
    say: "The company this mailbox belongs to. The page and Today's note group mail by it."
  address:
    label: Mailbox address
    say: "The address this mailbox signs in with, like alex@example.com."
  password:
    label: App password
    say: 'An app password: a separate password your mail provider makes just for Hisho, so your normal one stays yours (most providers ask for one when two-step sign-in is on). Not sure where? Type the address and press Set up this mailbox: Hisho names your provider and links its app-password page. Or the name of a saved secret.'
  imap_host:
    label: IMAP server
    say: "Where Hisho reads mail (IMAP over TLS, port 993). Set up this mailbox fills it in. Empty means imap.zoho.com (Zoho's free plan); a paid Zoho plan uses imappro.zoho.com. Other providers list it in their mail settings help."
    get: "https://www.zoho.com/mail/help/imap-access.html"
    get_label: Zoho's server names
  imap_port:
    say: "Empty means 993, the usual secure IMAP port."
  folder:
    say: "The folder to read. Empty means INBOX."
  folders:
    label: Other folders to read
    say: "Empty or all: every folder (Archive, Spam, your own, new ones as you make them) but Trash, Drafts and templates; Sent is read only to spot answered mail. Or the folders' names, separated by commas. Junk in Spam goes on the clean-up card (moved to Trash only when you approve); a Spam email that looks real shows as possibly misfiled. Clean-up covers the inbox, Spam and the Newsletter and Notification folders."
  alerts:
    label: Phone alerts
    say: "On: a pressing email (a client problem, a deadline within 48 hours, a payment or legal notice) is pushed to your phone. Off: it only shows on the page and in Today's note."
  personal:
    label: Personal mailbox
    say: "On: sorted as your own mail (bills, appointments, deliveries, sign-in and security notices, people you know) instead of a business's; pressing means due within 48 hours, a payment problem, a sign-in you may not have made, or a court or government notice. Empty means on when the company is Personal. Job search comes first: recruiters, applications, interviews and job alerts lead Today's note and the page, are never cleaned up, a likely job scam is flagged, and a push comes only when someone waits on your reply."
  drafts:
    label: Draft replies
    say: "On: emails that need an answer get a drafted reply on the Approvals page (nothing is sent until you press Send). Empty means on for a business mailbox and off for a personal one."
  request_form:
    label: Request form link
    say: "Optional. The web address of a form customers can use for requests, like https://example.com/request. Drafted replies point to it."
  sent_folder:
    say: "The folder your sent mail is kept in. Empty means Sent."
  smtp_host:
    label: SMTP server
    say: "Where Hisho sends approved replies. Set up this mailbox fills it in. Empty means smtppro.zoho.com for a paid Zoho mailbox, otherwise smtp.zoho.com."
    get: "https://www.zoho.com/mail/help/imap-access.html"
    get_label: Zoho's server names
  smtp_port:
    say: "Empty means 465, the usual secure sending port. 587 also works (encrypted with STARTTLS before signing in), for Microsoft and iCloud."
  from_name:
    label: Your name on sent mail
    say: "The name people see on your replies, like Alex Rivera."
  signature:
    label: Sign-off
    say: "How drafted replies end. Empty means your name and company."
  signature_html:
    label: HTML sign-off file
    say: "Optional. A .html file in Hisho's add-on settings folder, like email-signatures/acme.html, used as a formatted sign-off."
  phone:
    say: "Optional. Adds a Phone line to the sign-off."
  max_sends_per_hour:
    label: Most sent per hour
    say: "A safety limit on emails sent from this mailbox each hour. Empty means 10."
  own_addresses:
    label: Your other addresses
    say: "Your other email addresses, separated by commas. Hisho never drafts a reply to them."
  trash_folder:
    say: "Where approved clean-ups move mail. Empty means Trash. Nothing is ever deleted for good."
  note:
    say: "Anything that helps you remember this mailbox."
